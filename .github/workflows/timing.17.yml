name: Daily Git Summary at 17:00

on:
  schedule:
    # Minden nap 17:00-kor (UTC idő szerint) indul
    - cron: '0 17 * * *'
  # Lehetővé teszi a kézi indítást is a GitHub felületén (Actions fül)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  THIS_REPO: villgzs/schedule.git
  THIS_REPO_PATH: schedule
  SCRIPT_NUMBER: "17"

jobs:
  update-summary:
    runs-on: ubuntu-slim
    outputs:
      i_am_alone: ${{steps.in_progress.outputs.i_am_alone}}
      dev_time: ${{ steps.time_check.outputs.dev_time_result }}
      latest_time: ${{ steps.time_check.outputs.latest_time_result }}
      seconds_for_next_hour: ${{ steps.time_check.outputs.remaining }}

    steps:
      - name: Check current hour and set result
        id: time_check
        env:
          TZ: Europe/Budapest
        run: |
          IDLETIME="true"
          DEVTIME="false"
          LATESTTIME="false"

          now_epoch=$(date +%s)
          # Következő egész óra epoch időbélyege (a következő 00 perc és 00 másodperc)
          next_hour_epoch=$(date -d "$(date -d "@$now_epoch" '+%Y-%m-%d %H:00:00') + 1 hour" +%s)

          remaining=$((next_hour_epoch - now_epoch))
          echo "Hátralévő másodpercek a következő egész óráig: $remaining"

          now=$(date +%H:%M)

          # 03:00 és 06:00 között (06:00-ig, tehát 03:00 <= now < 06:00)
          if [[ "$now" > "03:00" && "$now" < "06:00" ]]; then
            DEVTIME="true"
          fi
          # 02:00 és 06:00 között (06:00-ig, tehát 02:00 <= now < 06:00)
          if [[ "$now" > "22:00" && "$now" < "23:59" ]]; then
            LATESTTIME="true"
          fi

          echo "Current time: $now -> dev_time_result=$DEVTIME"
          echo "Current time: $now -> latest_time_result=$LATESTTIME"


          echo "dev_time_result=$DEVTIME" >> "$GITHUB_OUTPUT"
          echo "latest_time_result=$LATESTTIME" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

          echo "Current time: $now -> dev_time_result=$DEVTIME" >> "$GITHUB_STEP_SUMMARY"
          echo "Current time: $now -> latest_time_result=$LATESTTIME" >> "$GITHUB_STEP_SUMMARY"
          echo "Waiting for next hour: $remaining" >> "$GITHUB_STEP_SUMMARY"


      - name: Check if another workflow is running
        id: in_progress
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # A workflow saját sorszáma (00-23), pl. timing.00.yml esetén "00"
            SLOT: ${{ env.SCRIPT_NUMBER }}
            SELF_RUN_ID: ${{ github.run_id }}
        run: |
            sleep 10

            RUNNING_COUNT=$(gh run list\
                --repo villgzs/schedule\
                --status in_progress\
                --json databaseId,workflowName,headBranch,url,createdAt |\
                jq 'length')
            echo "### Workflow futás ellenőrzése (\`timing.${SLOT}.yml\`)"
            echo "- Futások száma: $RUNNING_COUNT"

            {
            echo "### Workflow futás ellenőrzése (\`timing.${SLOT}.yml\`)"
            echo "- Futások száma: $RUNNING_COUNT"
            if [ "$RUNNING_COUNT" -gt 1 ]; then
                echo "- Van másik futás."
                RESULT="false"
            else
                echo "- Csak egyedüliként fut a workflow fájl."
                RESULT="true"
            fi
            } >> "$GITHUB_STEP_SUMMARY"

            echo "i_am_alone=${RESULT}" >> "$GITHUB_OUTPUT"

      - name: Repository letöltése (Checkout) és az összes branch lekérése
        if: steps.in_progress.outputs.i_am_alone == 'true'
        uses: actions/checkout@v4

        with:
          fetch-depth: 0 # Szükséges a távoli branchek eléréséhez
          path: ${{ env.THIS_REPO_PATH }}

      - name: Proc branchek ellenőrzése és összefűzése (merge)
        if: steps.in_progress.outputs.i_am_alone == 'true'
        working-directory: ${{ env.THIS_REPO_PATH }}
        run: |

          # Git konfiguráció a műveletekhez
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Váltás a main ágra (vagy az alapértelmezett ágra)
          git checkout main

          # Végigmegyünk 00-tól 23-ig (vagy amennyi szükséges)
          for i in {00..23}; do
            BRANCH_NAME="${i}proc"

            # Megvizsgáljuk, hogy létezik-e a branch a távoli repóban (origin/<branch_name>)
            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
              echo "A(z) $BRANCH_NAME branch létezik, letöltés és merge..."

              # Helyi branch létrehozása a távoli alapján és összefűzés
              git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
              git checkout main

              # Összefűzés ütközésvizsgálat nélkül (-X patience vagy alapértelmezett merge, --no-edit a commit üzenethez)
              git merge "$BRANCH_NAME" --no-edit --allow-unrelated-histories
            else
              echo "A(z) $BRANCH_NAME branch nem létezik, kihagyva."
            fi
          done


      - name: Feltöltés új, üres (orphan) branch-be
        if: steps.in_progress.outputs.i_am_alone == 'true'
        working-directory: ${{ env.THIS_REPO_PATH }}
        run: |
          # Git konfiguráció
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${{ env.SCRIPT_NUMBER }}proc"

          # Megpróbáljuk letölteni a meglévő távoli proc ágat (ha már létezik)
          if git fetch origin "$TARGET_BRANCH" 2>/dev/null; then
            # Ha létezik a távoli ág, átváltunk rá és frissítjük
            git checkout "$TARGET_BRANCH"
          else
            # Ha még nem létezik, létrehozunk egy teljesen tiszta, üres (orphan) ágat
            git checkout --orphan "$TARGET_BRANCH"
            # Töröljük a checkout által hozott felesleges fájlokat, hogy üres maradjon
            git rm -rf . || true
          fi


          # A fájl újra létrehozása (vagy biztosítása), mert az orphan váltás törölheti a munkamappát
          mkdir -p schedule
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          FILE_PATH="schedule/${{ env.SCRIPT_NUMBER }}lastrun.txt"
          echo "Futás időpontja: $CURRENT_TIME" > "$FILE_PATH"

          # Hozzáadjuk a fájlt
          git add "$FILE_PATH"

          # Csak akkor commitolunk, ha van változás
          git commit -m "chore: update schedule lastrun timestamp for ${{ env.SCRIPT_NUMBER }}" || echo "Nincs változás a commitoláshoz"

          # Kényszerített feltöltés (push) az adott orphan branch-re
          git push origin "HEAD:$TARGET_BRANCH" --force


  main-activity:
    runs-on: ubuntu-slim
    needs: update-summary
    if: needs.update-summary.outputs.i_am_alone == 'true'
    # Szükséges a jogosultság, hogy a workflow írni tudjon a repóban
    permissions:
      contents: write

    steps:

      - name: Update orphan trigger-latest branch in villgzs/hass-core32 - tic-tac-toe
        env:
            TARGET_TOKEN: ${{ secrets.PUSH_TO_HASS_CORE32_TRIGGER }}
            TARGET_REPO: villgzs/hass-core32
            TARGET_BRANCH: tic-tac-toe
            TARGET_FILE: trigger.txt
        run: |
            set -euo pipefail

            WORK_DIR="$(mktemp -d)"
            trap 'rm -rf "$WORK_DIR"' EXIT

            cd "$WORK_DIR"
            git init
            git remote add origin "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git"

            # Main branch letöltése
            git fetch origin main

            # Új, előzmények nélküli branch létrehozása a main tartalmával
            git checkout --orphan "$TARGET_BRANCH" origin/main

            # A trigger fájl létrehozása
            printf 'triggered_at=%s\nsource_repo=%s\nrun_id=%s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                "${{ github.repository }}" \
                "${{ github.run_id }}" > "$TARGET_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # A main teljes tartalmának és a trigger fájlnak a hozzáadása
            git add -A
            git commit -m "chore: update from main and trigger"

            # Force push → a régi history teljesen eltűnik
            git push --force origin "HEAD:${TARGET_BRANCH}"

            echo "### Orphan trigger branch frissítve" >> "$GITHUB_STEP_SUMMARY"
            echo "- Forrás: main" >> "$GITHUB_STEP_SUMMARY"
            echo "- Cél: \`${TARGET_REPO}\` → \`${TARGET_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Fájl: \`${TARGET_FILE}\`" >> "$GITHUB_STEP_SUMMARY"
