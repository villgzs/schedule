name: Daily Git Summary at -index-:00

on:
  schedule:
    # Minden nap -index-:00-kor (UTC idő szerint) indul
    - cron: '0 -index- * * *'
  # Lehetővé teszi a kézi indítást is a GitHub felületén (Actions fül)
  workflow_dispatch:

jobs:
  update-summary:
    runs-on: ubuntu-latest

    # Környezeti változók a job szintjén (a script száma)
    env:
      script-number: "-index-"

    # Szükséges a jogosultság, hogy a workflow írni tudjon a repóban
    permissions:
      contents: write

    steps:
      - name: Repository letöltése (Checkout)
        uses: actions/checkout@v4

      - name: Időpont rögzítése a lastrun.txt fájlba
        run: |
          # A schedule könyvtár létrehozása, ha még nem létezik
          mkdir -p schedule

          # Aktuális dátum és idő lekérése
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Fájl útvonala a script-number változó felhasználásával
          FILE_PATH="schedule/${{ env.script-number }}lastrun.txt"

          # Kiírás a fájl végére
          echo "Futás időpontja: $CURRENT_TIME" >> "$FILE_PATH"

          echo "Sikeresen rögzítve ide: $FILE_PATH ($CURRENT_TIME)"

      - name: Feltöltés új, üres (orphan) branch-be
        run: |
          # Git konfiguráció
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${{ env.script-number }}proc"

          # Új, tiszta (előzmények nélküli) git repository inicializálása a helyi runneren
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"

          # Megpróbáljuk letölteni a meglévő távoli proc ágat (ha már létezik)
          git fetch origin "$TARGET_BRANCH" && git checkout "$TARGET_BRANCH" || git checkout --orphan "$TARGET_BRANCH"

          # A schedule mappa és a fájl másolása a friss/meglévő üres ágba (ha máshonnan maradt volna valami, töröljük)
          # Most csak a schedule/ tartalom kell, de biztosítjuk, hogy a mappa struktúra megmaradjon.
          git add schedule/${{ env.script-number }}lastrun.txt

          # Csak akkor commitolunk, ha van változás
          git commit -m "chore: update schedule lastrun timestamp for ${{ env.script-number }}" || echo "Nincs változás a commitoláshoz"

          # Kényszerített feltöltés (push) az adott orphan branch-re
          git push origin "HEAD:$TARGET_BRANCH" --force
